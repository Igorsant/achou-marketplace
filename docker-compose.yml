services:
  postgres:
    image: postgres:17-alpine
    container_name: achou_postgres
    environment:
      POSTGRES_USER: achou
      POSTGRES_PASSWORD: achou_dev
      POSTGRES_DB: achou_marketplace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achou -d achou_marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: achou_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: achou_api
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://achou:achou_dev@postgres:5432/achou_marketplace?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: npm run start:dev

volumes:
  pgdata:
  redisdata:
