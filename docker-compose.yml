# Configuracao comum a API e ao worker: mesma imagem, mesmo .env, mesmas dependencias.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: development
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgresql://achou:achou_dev@postgres:5432/achou_marketplace?schema=public
    REDIS_HOST: redis
    REDIS_PORT: 6379
    # Fixadas aqui porque observability/prometheus/prometheus.yml depende delas.
    METRICS_PORT: 9464
    WORKER_METRICS_PORT: 9465
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend/src:/app/src
    - ./backend/prisma:/app/prisma

services:
  postgres:
    image: postgres:17-alpine
    container_name: achou_postgres
    environment:
      POSTGRES_USER: achou
      POSTGRES_PASSWORD: achou_dev
      POSTGRES_DB: achou_marketplace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achou -d achou_marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: achou_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    container_name: achou_api
    ports:
      - "3001:3000"
    command: npm run start:dev

  # Mesma imagem da API, outro entrypoint: relay do outbox + consumidores da
  # fila. Nao atende HTTP; so a porta de metricas, visivel apenas na rede interna.
  worker:
    <<: *backend
    container_name: achou_worker
    command: npm run start:worker:dev

  # ---------------------------------------------------------- observabilidade
  # As portas de metricas (9464 da API, 9465 do worker) nao sao publicadas no
  # host: so o Prometheus, dentro da rede do compose, raspa esses alvos.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: achou_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Permite recarregar a config sem reiniciar: curl -X POST localhost:9090/-/reload
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    container_name: achou_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: achou_dev
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/achou-marketplace.json
    ports:
      - "3002:3000"
    volumes:
      # Subpasta por subpasta: montar provisioning/ inteiro apaga as pastas
      # vazias da imagem (alerting/, plugins/) e o Grafana loga erro na subida.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
