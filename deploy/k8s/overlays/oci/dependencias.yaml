# Redis de cache dentro do cluster. O Postgres e gerenciado (fora do cluster)
# e a fila e a OCI Queue: ver infra/oci/1-cluster. Senha vem do Terraform
# (infra/oci/2-plataforma/aplicacao.tf, Secret "credenciais").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: achou-dependencias
  labels:
    deploy.achou/etapa: pre-requisito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # So cache: memoria cheia descarta a chave usada ha mais tempo
          # (allkeys-lru), e sem persistencia -- um restart so esfria o cache,
          # e a API segue no Postgres enquanto isso.
          command: ["sh", "-c"]
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciais
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: achou-dependencias
  labels:
    deploy.achou/etapa: pre-requisito
spec:
  selector:
    app: redis
  ports:
    - port: 6379
