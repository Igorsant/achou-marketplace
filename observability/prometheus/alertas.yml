# Regras avaliadas pelo Prometheus. Sem Alertmanager no ambiente local: os
# alertas aparecem em http://localhost:9090/alerts e no painel do Grafana.
groups:
  - name: achou-api
    rules:
      - alert: AlvoForaDoAr
        expr: up{job=~"api|worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} nao responde ao scrape ha 1 minuto"

      # process_cpu_seconds_total conta segundos de CPU: a taxa e a fracao de
      # UM nucleo. O Node roda o JavaScript numa thread so, entao 70% de um
      # nucleo e o limite real do processo, qualquer que seja a maquina.
      - alert: CpuNoGatilhoDeEscala
        expr: rate(process_cpu_seconds_total{job="api"}[1m]) > 0.7
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API em {{ $value | humanizePercentage }} de CPU, acima do gatilho de auto-scaling (70%)"

      - alert: TaxaDeErro5xxAlta
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api", status_code=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count{job="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} das respostas da API sao 5xx"

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(http_request_duration_seconds_bucket{job="api"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 de {{ $labels.route }} em {{ $value | humanizeDuration }}"

      # O cache degrada graciosamente (a API segue no Postgres), entao a queda
      # do Redis nao gera erro -- so aparece aqui e na latencia.
      - alert: CacheIndisponivel
        expr: sum(rate(achou_cache_consultas_total{resultado=~"indisponivel|erro"}[2m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Leituras do catalogo indo direto ao Postgres: Redis fora do ar"

  - name: achou-assincrono
    rules:
      # Idade, nao contagem: rajada de cadastros enche o outbox por segundos
      # e e normal; evento parado ha um minuto significa relay ou fila fora.
      - alert: OutboxAtrasado
        expr: achou_outbox_atraso_segundos > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Evento pendente no outbox ha {{ $value | humanizeDuration }}"

      - alert: NotificacoesEsgotadas
        expr: increase(achou_notificacoes_total{resultado="esgotada"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Notificacoes esgotaram as tentativas; reprocessar com scripts/fila.sh retry"
