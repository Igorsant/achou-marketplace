# Intervalo curto de proposito: no ambiente local o objetivo e ver o efeito de
# um teste de carga em segundos. Em producao, 15s-30s bastam e custam menos.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - alertas.yml

scrape_configs:
  # Porta de metricas, nao a porta HTTP: /metrics nao existe na porta publica.
  # Com varias replicas (Kubernetes), troque static_configs por
  # kubernetes_sd_configs e cada pod vira um alvo com seu proprio "instance".
  - job_name: api
    static_configs:
      - targets: ["api:9464"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9465"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
