apiVersion: 1

datasources:
  - name: Prometheus
    # uid fixo: e por ele que os paineis do dashboard referenciam a fonte.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Igual ao scrape_interval, para o $__rate_interval nunca pedir uma
      # janela menor que dois scrapes.
      timeInterval: 5s
